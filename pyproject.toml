[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intanalysis"
version = "0.1.0"
description = "AI-Powered Financial News Intelligence System with LangGraph multi-agent architecture"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Vikas Rajpoot"}
]
keywords = ["financial-news", "nlp", "langgraph", "rag", "deduplication", "entity-extraction"]

dependencies = [
    # LangGraph for multi-agent orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    # LLM
    "anthropic>=0.30.0",
    # Embeddings & Vector Store
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    # BM25 for hybrid search
    "rank-bm25>=0.2.2",
    # NLP
    "spacy>=3.7.0",
    # Utilities
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
intanalysis = "intanalysis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intanalysis*"]
